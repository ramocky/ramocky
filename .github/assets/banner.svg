<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="ramocky — Frontend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b1b2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="220" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36bcf7">
        <animate attributeName="stop-color" values="#36bcf7;#a371f7;#36bcf7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#e6edf3">
        <animate attributeName="stop-color" values="#e6edf3;#36bcf7;#e6edf3" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#36bcf7">
        <animate attributeName="stop-color" values="#36bcf7;#a371f7;#36bcf7" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36bcf7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36bcf7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f6feb" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="320" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="180" cy="70" r="190" fill="#36bcf7" opacity="0.10">
      <animate attributeName="cx" values="180;1020;180" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="250" r="210" fill="#a371f7" opacity="0.10">
      <animate attributeName="cx" values="1020;180;1020" dur="20s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="-140" width="1200" height="140" fill="url(#scan)">
      <animate attributeName="y" values="-140;320" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0.55">
      <text x="600" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="8" fill="#ff2d75">
        ramocky
        <animateTransform attributeName="transform" type="translate" values="-4 0;4 0;-2 0;-4 0" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>
    <g opacity="0.55">
      <text x="600" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="8" fill="#36bcf7">
        ramocky
        <animateTransform attributeName="transform" type="translate" values="4 0;-4 0;2 0;4 0" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="600" y="168" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="96" font-weight="700" letter-spacing="8" fill="url(#titleFill)" filter="url(#glow)">
      ramocky
    </text>

    <rect x="300" y="206" width="600" height="2" fill="url(#rule)">
      <animate attributeName="x" values="300;380;300" dur="9s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="6" fill="#8b949e">
      FRONTEND ENGINEER
      <tspan fill="#36bcf7"> · </tspan>
      VUE / REACT NATIVE / USERSCRIPT
    </text>

    <text x="600" y="286" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8b949e">
      &lt; automate everything that repeats /&gt;
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </text>

    <path d="M0 306 C 200 286, 400 322, 600 304 S 1000 282, 1200 306 L1200 320 L0 320 Z" fill="#36bcf7" opacity="0.20"/>
    <path d="M0 314 C 220 300, 420 326, 620 312 S 1010 296, 1200 314 L1200 320 L0 320 Z" fill="#a371f7" opacity="0.16"/>
  </g>
</svg>
