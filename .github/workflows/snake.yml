name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ramocky
          # PAT_TOKEN 存在时用它抓取（可包含私有贡献），否则回落到内置 token
          github_token: ${{ secrets.PAT_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#1f2328&color_dots=#ebedf0,#d8dee4,#b1bac4,#7d8590,#424a53

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
